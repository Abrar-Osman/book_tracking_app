<!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Homepage</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="../static/style.css">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>

      <div class="container p-1 my-2 container-fluid">
          <nav class="navbar navbar-expand-lg  mb-100">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                  <a href="/" class="text-decoration-none"><span class="navbar-text mb-0 h4 m-3 text-dark">BOOK TRACKER</span></a>
                <ul class="navbar-nav mr-auto">
                  <li class="nav-item">
                    <a class="btn btn-warning btn-sm m-3 " type="submit" href="/home">Home</a>
                  </li>   
                  <li class="nav-item">
                    <a class="btn btn-warning btn-sm m-3 " type="submit" href="/book_list">My Books</a>
                  </li>   
                  <li class="nav-item">
                    <a class="btn btn-warning btn-sm m-3 " type="submit" href="user_picks">Top Pick</a>
                  </li>  
                  <li class="nav-item">
                    <a class="btn btn-warning btn-sm m-3 " type="submit" href="/profile">Profile</a>
                  </li>     
                  <li class="nav-item">
                    <a class="btn btn-warning btn-sm m-3 " type="submit" href="/logout">logout</a>
                  </li>                 
                </ul>
                <!-- action="/search" -->
                  <form class="d-flex " action="/search" method="GET"> 
                  <input class="form-control m-2 " type="text" placeholder="Search" name="q" id="search">
                  <button class="btn btn-warning btn-sm m-2 " type="submit">Search</button>
                </form>
              </div>
            </nav> 
      

      {% block content %} 
    {% endblock %} 
    </div>
  </body>
</html>
