<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</head>
<body style="background-color: #6c757d;">
    <div class="container p-1 my-2">
        <nav class="navbar navbar-expand-sm bg-secondary">
            
            <div class="container-fluid">
                <a href="/" class="text-decoration-none"><span class="navbar-text mb-0 h4 text-warning">BOOK TRACKER</span></a>
                <li class="nav-item">
                  <button class="btn btn-warning btn-sm m-2 " type="submit" onclick="logoutUser()">logout</button>
                </li>                 
              </ul>
                <form class="d-flex"  action="/search"  method="GET"> 
                <input class="form-control m-2" type="text" placeholder="Search" name="q" id="search">
                <button class="btn btn-warning btn-sm m-2" type="submit" required>Search</button>
              </form>
            </div>
          </nav>

          <section class="vh-100"> 
            <div class="container mx-auto mt-4">
              <div class="row">
                {% for book in books%}
                <div class="col-md-4 mb-5">
                  <div class="card h-100 mb-3" style="width: 18rem;">
                    <img src="../static/book.jpeg" class="card-img-top" alt="...">
                        <div class="card-body">
                          <h6 class="card-title">{{book.book_title}}</h6>
                          <div class="d-flex">
                            <div class="p-2  flex-fill">
                              <form action="/delete" method="POST, GET">
                            <input type="hidden" name="book_id" value="{{ book.id }}">
                            <button class="btn btn-warning btn-sm" type="submit">Delete</button>
                          </form>
                            </div>
                            <div class="p-2  flex-fill">
                              <form action="/add_reading_list" method="POST, GET" class="d-flex">
                            <input type="hidden" name="book_id" value="{{ book.id }}">
                            <input type="hidden" name="book_title" value="{{ book.book_title }}">
                            <button class="btn btn-warning btn-sm" type="submit">Add To Read</button>
                          </form>
                            </div>
                        </div>
                        </div>
                  </div>
                </div>
                {% endfor %}
              </div>
            </div>
              
              
                 
          
        </section>
          


    </div>

</body>
</html>
