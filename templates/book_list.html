{% extends "base.html" %}
{% block content %}  
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
  {% for category, message in messages %}
  <div class="alert  alert-{{ category }} alert-dismissible fade show" role="alert">
    <strong>{{ message }}</strong>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
{% endif %}
{% endwith %}
          <section class="vh-100"> 
            <div class="container mx-auto mt-4">
              <div class="row">
                {% for book in books%}
                <div class="col-md-4 mb-5">
                  <div class="card h-100 mb-3" style="width: 18rem;">
                    <img src="../static/book.jpeg" class="card-img-top" alt="...">
                        <div class="card-body">
                          <h6 class="card-title">{{book.book_title}}</h6>
                          <div class="d-flex">
                            <div class="p-2  flex-fill">
                              <form action="/delete" method="POST, GET">
                            <input type="hidden" name="book_id" value="{{ book.id }}">
                            <button class="btn btn-warning btn-sm" type="submit">Delete</button>
                          </form>
                            </div>
                            <div class="p-2  flex-fill">
                              <form action="/add_user_picks" method="POST, GET" class="d-flex">
                            <input type="hidden" name="book_id" value="{{ book.id }}">
                            <input type="hidden" name="book_title" value="{{ book.book_title }}">
                            <button class="btn btn-warning btn-sm" type="submit">Favourite</button>
                          </form>
                            </div>
                        </div>
                        </div>
                  </div>
                </div>
                {% endfor %}
              </div>
            </div>
              
              
                 
          
        </section>
          


 {% endblock %}
